name: Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and test dependencies
        # Do not install PyPI cqlib 1.3.x: this package needs the cqlib 2.x API,
        # and tests/conftest.py provides a double when cqlib is absent.
        # cqlib-tianyan is not on PyPI yet; the Tianyan tests mock it.
        # pyscf is optional and skipped where missing (notably Windows).
        run: |
          python -m pip install "pytest>=8" "numpy>=2.1" "scipy>=1.11" "openfermion>=1.6"
          python -m pip install --no-deps .
      - name: Run tests
        run: python -m pytest
